name: Android APK

# This fork builds only the Android app, not the Linux, Windows or web ports.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install ninja and ccache
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools"
          rm ninja.zip
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # Without a custom keystore, Gradle automatically signs the non-debuggable
      # release APK with a temporary CI debug key. No secrets are required.
      - name: Build Android release APK
        run: python3 tools/ci_build.py android release

      - name: Test 7z game data imports
        run: cd port/android && ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Test touch layout
        run: python3 tools/test_touch_layout.py

      # Keep the compiled APK downloadable even when a later test fails.
      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halo-android-release
          path: dist/halo-android-release/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish Android APK
    needs: [android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: halo-android-release
          path: android-dist

      - name: Publish direct APK and ZIP
        run: |
          cp android-dist/app-release.apk halo-android-release.apk
          (cd android-dist && zip -qr "$GITHUB_WORKSPACE/halo-android-release.zip" .)
          gh release create "build-$GITHUB_RUN_NUMBER" \
            halo-android-release.apk halo-android-release.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Android build $GITHUB_RUN_NUMBER" \
            --notes "Android release APK built from main and verified by the Android unit tests. Without a persistent signing key, uninstall earlier CI-signed versions before installing a new one; back up saves first."
